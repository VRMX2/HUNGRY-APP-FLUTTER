name: hungry
description: "Hungry Application Mobile With Flutter"
publish_to: 'none'
version: 1.0.0+1

# Dart SDK version constraint
environment:
  sdk: ^3.9.0

# Production dependencies
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.2
  gap: ^3.0.1

# Development dependencies
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# Flutter configuration
flutter:
  uses-material-design: true

  # Asset directories
  assets:
    - assets/
    - assets/logo/
    - assets/splash/